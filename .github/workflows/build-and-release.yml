name: Build APK and publish release

# Click: Actions -> "Build APK and publish release" -> Run workflow
# (also runs by itself every time you push to the main branch)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (example 1.0.5) - leave empty for automatic'
        required: false
        default: ''
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create .env (Gemini key from repository secret, optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env

      - name: Choose signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KS_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "HAS_PLAY_KEY=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/ci/apk-signing.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=lifeeasy-ci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=lifeeasy" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=lifeeasy-ci" >> "$GITHUB_ENV"
          fi

      - name: Set version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${INPUT_VERSION:-1.0.${{ github.run_number }}}" >> "$GITHUB_ENV"

      - name: Build APK (for GitHub download)
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk LIFE-EASY.apk

      - name: Build AAB (for Google Play, only if your own upload key secret exists)
        if: env.HAS_PLAY_KEY == 'true'
        env:
          UPDATE_REPO: ''
        run: |
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/*.aab LIFE-EASY.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LIFE EASY v${{ env.VERSION_NAME }}
          body: |
            LIFE EASY by MAHADI HASAN JEWEL
            Download **LIFE-EASY.apk** below and install it on your Android phone.
          files: |
            LIFE-EASY.apk
            LIFE-EASY.aab
          fail_on_unmatched_files: false
          make_latest: true
